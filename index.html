<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#24221e">
    <link rel="icon" href="data:,">
    <title>Blicket Task</title>
    <link rel="stylesheet" href="./styles.css?v=20260928c">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Blicket Task</h1>
          <p id="subtitle" class="subtitle">A small 3D causal discovery game</p>
        </div>
        <div class="topbar-right">
          <span id="progress" aria-live="polite">Ready to begin</span>
          <button id="sound" class="quiet" type="button" aria-pressed="true">Sound on</button>
          <button id="restart" class="quiet" type="button" hidden>Restart</button>
        </div>
      </header>

      <main>
        <section class="instructions" aria-live="polite">
          <h2 id="prompt">Find out which object makes the detector go.</h2>
          <p id="detail">Put each object on the detector, watch what happens, then make your choices.</p>
        </section>

        <div class="playfield">
          <div id="scene" class="scene" role="img" aria-label="Interactive 3D Blicket detector and objects"></div>
          <div id="language-menu" class="language-menu" aria-labelledby="language-title">
            <h3 id="language-title">Choose a language</h3>
            <p id="language-detail">The game and narrator will use your choice.</p>
            <div class="language-choices">
              <button id="language-en" type="button" lang="en">English</button>
              <button id="language-de" type="button" lang="de">Deutsch</button>
            </div>
            <button id="begin" type="button" disabled>Loading 3D scene…</button>
          </div>
          <div id="quiz" class="quiz" role="group" aria-label="Answer choices" hidden>
            <button id="answer-cube" type="button" data-object-id="obj_cube" hidden>Cube</button>
            <button id="answer-column" type="button" data-object-id="obj_column" hidden>Cylinder</button>
            <button id="answer-block" type="button" data-object-id="obj_block" hidden>Rectangular block</button>
            <button id="answer-yes" type="button" data-answer="blicket" hidden>Blicket</button>
            <button id="answer-no" type="button" data-answer="not_blicket" hidden>Not a Blicket</button>
          </div>
        </div>

        <div class="footer-row">
          <span id="feedback" role="status">Select Begin to start.</span>
          <div class="actions">
            <button id="next" type="button" hidden>Next object</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./game.js?v=20260928f"></script>
  </body>
</html>
